services:
  - type: web
    name: mehrad-ai
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: APP_URL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
    disk:
      name: mehrad-data
      mountPath: /data
      sizeGB: 1
